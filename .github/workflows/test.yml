name: Tests

# Run the full test suite for every pull request and every push to main.
# When configured as a required status check (see docs/CI_SETUP.md), a failing
# run blocks the PR from being merged.
on:
  pull_request:
    branches:
      - main
      - '0.0.*'
  push:
    branches:
      - main

# Cancel an in-progress run for the same branch/PR when a new commit arrives,
# so we don't burn CI minutes on stale work.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: mvn test (JDK 8)
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          # Spring Boot 1.5.7 + javax.* APIs require Java 8
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run unit tests
        # -B = batch mode (no progress bars in CI logs)
        # Selects every class ending in *Test (singular). BlogApplicationTests
        # is the only *Tests (plural) and is intentionally excluded — it's a
        # full @SpringBootTest that loads the real ApplicationContext, which
        # validates MySQL-specific JPQL (e.g. date_format()) so it can't run
        # without a live MySQL server. All other tests are pure unit tests
        # using Mockito mocks / MockMvc standalone setup — no DB needed.
        # (Surefire 2.18.1 doesn't support the `!Pattern` negation syntax,
        # which is why we filter by naming convention instead.)
        run: mvn -B -ntp test -Dtest='*Test'

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
