name: Release on merge to main

# Fires whenever a commit lands on main. The body of the job decides whether
# to actually cut a release (only for PR-merge commits with a -SNAPSHOT pom)
# so direct pushes and release-commit pushes do NOT loop forever.
on:
  push:
    branches: [main]

jobs:
  release:
    # Only on PR-merge commits. GitHub merge commits look like:
    #   "Merge pull request #N from ..."           (true merge)
    #   "<title> (#N)"                              (squash merge)
    # Both patterns are matched below. Direct pushes to main and release
    # commits produced by this very workflow are skipped.
    if: |
      (startsWith(github.event.head_commit.message, 'Merge pull request')
       || contains(github.event.head_commit.message, '(#'))
      && !startsWith(github.event.head_commit.message, 'Release ')
      && !startsWith(github.event.head_commit.message, 'Bump to ')

    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to push the release commit and the tag

    steps:
      - name: Check out main with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compute release version (-SNAPSHOT -> -RELEASE)
        id: ver
        run: |
          set -euo pipefail
          CURRENT=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "Current pom version: $CURRENT"

          if [[ "$CURRENT" != *-SNAPSHOT ]]; then
            echo "::notice::Version $CURRENT is not a SNAPSHOT — nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RELEASE="${CURRENT%-SNAPSHOT}-RELEASE"
          echo "Release version will be: $RELEASE"

          # Refuse to clobber an existing tag
          if git rev-parse -q --verify "refs/tags/${RELEASE}" >/dev/null; then
            echo "::notice::Tag ${RELEASE} already exists — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mvn -q versions:set -DnewVersion="$RELEASE" -DgenerateBackupPoms=false
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

      - name: Run the test gate against the release version
        if: steps.ver.outputs.skip != 'true'
        # Mirrors the test workflow's selector exactly: every *Test class
        # (singular) — BlogApplicationTests (*Tests plural) is excluded
        # because it needs a live MySQL server.
        run: mvn -B -ntp test -Dtest='*Test'

      - name: Commit, tag, push
        if: steps.ver.outputs.skip != 'true'
        env:
          RELEASE: ${{ steps.ver.outputs.release }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pom.xml
          git commit -m "Release ${RELEASE}"

          # Annotated tag so the message is preserved
          git tag -a "${RELEASE}" -m "Release ${RELEASE}"

          git push origin main
          git push origin "refs/tags/${RELEASE}"

          echo "::notice::Released ${RELEASE} at $(git rev-parse HEAD)"
